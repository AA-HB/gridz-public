<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Installer Gridz</title>
  <meta name="description" content="Gridz — le jeu de mots fléchés en ligne. Défis quotidiens, parties multijoueur et classement.">
  <meta name="theme-color" content="#0B1018">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Smart App Banner Safari : propose l'app quand on arrive ici depuis iOS. -->
  <meta name="apple-itunes-app" content="app-id=6760212757">

  <!-- Aperçu dans WhatsApp / iMessage / Discord / Slack. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://play.gridz.fr/">
  <meta property="og:title" content="Gridz — Mots-Fléchés Online">
  <meta property="og:description" content="Défis quotidiens, parties multijoueur et classement. Installe Gridz et viens jouer.">
  <meta property="og:image" content="https://play.gridz.fr/app_icon.png">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    :root {
      --bg: #0B1018;
      --surface: #151C28;
      --border: #26303F;
      --text: #F4F6FA;
      --muted: #97A2B5;
      --gold-a: #FED058;
      --gold-b: #F79C2B;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    main {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .logo {
      width: 108px;
      height: 108px;
      border-radius: 26px;
      display: block;
      margin: 0 auto 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: -.4px;
    }

    p.tagline {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 18px;
      margin-bottom: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }

    a.btn:active { transform: scale(.985); }

    a.btn.primary {
      border: none;
      background: linear-gradient(135deg, var(--gold-a), var(--gold-b));
      color: #1A1207;
      font-weight: 700;
    }

    a.btn svg { flex: 0 0 auto; }

    .hint {
      margin-top: 22px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main>
    <img class="logo" src="app_icon.png" alt="Gridz">
    <h1>Gridz</h1>
    <p class="tagline">
      Le jeu de mots fléchés en ligne.<br>
      Défis quotidiens, parties multijoueur et classement.
    </p>

    <!--
      Ces boutons ne s'affichent que si l'app n'est pas installée : sinon iOS
      (Universal Links) ou Android (App Links) interceptent l'URL avant que la
      page ne se charge. Ils servent aussi de repli si le JS est bloqué.
      L'ordre est réarrangé par le script selon la plateforme détectée.
    -->
    <div id="actions">
      <a class="btn" id="ios" href="https://apps.apple.com/fr/app/gridzz/id6760212757">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .7 1.1 1.6 2.3 2.8 2.2 1.1 0 1.5-.7 2.9-.7s1.7.7 2.9.7c1.2 0 2-1.1 2.7-2.2.8-1.2 1.2-2.4 1.2-2.5-.1 0-2.3-.9-2.3-3.6zM14.2 5.5c.6-.8 1-1.8.9-2.9-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.8-1 2.8 1 .1 2-.5 2.7-1.3z" />
        </svg>
        Télécharger sur l'App Store
      </a>
      <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.gridz.game">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3.6 1.8c-.3.3-.5.8-.5 1.4v17.6c0 .6.2 1.1.5 1.4l.1.1 9.9-9.9v-.4L3.7 1.7l-.1.1zm13.3 6.6L14.5 6 4.9 1.1l12 11.1v-.4l-.1-3.4zM4.9 22.9l9.6-5.5 2.4-2.4-12 11.1.1-3.2zm13.9-9.1 2.7-1.5c.8-.4.8-1.2 0-1.6l-2.7-1.5-2.7 2.3 2.7 2.3z" />
        </svg>
        Disponible sur Google Play
      </a>
      <a class="btn" id="web" href="https://gridz.fr">
        Jouer dans le navigateur
      </a>
    </div>

    <p class="hint" id="hint">Redirection en cours…</p>
  </main>

  <script>
    (function () {
      var ua = navigator.userAgent || '';
      // iPadOS 13+ se déclare « MacIntel » : on le distingue par le tactile.
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/.test(ua);

      var platform = isIOS ? 'ios' : isAndroid ? 'android' : 'web';
      var target = document.getElementById(platform);

      // Le bouton de la plateforme détectée passe en premier et en doré.
      target.classList.add('primary');
      document.getElementById('actions').prepend(target);

      document.getElementById('hint').textContent = platform === 'web'
        ? 'Ouvre ce lien depuis ton téléphone pour installer l’application.'
        : 'Si rien ne se passe, utilise le bouton ci-dessus.';

      // ?stay=1 desactive la redirection : permet de relire la page de repli.
      if (/[?&]stay/.test(location.search)) return;

      // Laisse le temps à la page de peindre avant de partir vers le store,
      // pour que le repli soit visible au retour (bouton « Précédent »).
      setTimeout(function () {
        window.location.replace(target.href);
      }, 250);
    })();
  </script>
</body>

</html>
